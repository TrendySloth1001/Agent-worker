name: app
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  file_picker: ^13.1.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_math_fork: ^0.7.4
  flutter_svg: ^2.3.0
  highlight: ^0.7.0
  http: ^1.6.0
  http_parser: ^4.1.2
  hugeicons: ^1.2.0
  image_picker: ^1.2.3
  markdown: ^7.3.1
  pdfrx: ^2.2.24
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  video_player: ^2.11.1
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/html/kit.css
    - assets/mermaid/diagram.html
    - assets/mermaid/mermaid.min.js
    - assets/mermaid/VERSION

  fonts:
    - family: Doto
      fonts:
        - asset: assets/fonts/Doto.ttf
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
        - asset: assets/fonts/SpaceMono-Bold.ttf
          weight: 700
