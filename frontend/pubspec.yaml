name: app
publish_to: none
version: 1.0.6+7

environment:
  sdk: ^3.10.7

dependencies:
  file_picker: ^13.1.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_markdown_plus: ^1.0.12
  flutter_math_fork: ^0.7.4
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  highlight: ^0.7.0
  http: ^1.6.0
  http_parser: ^4.1.2
  hugeicons: ^1.2.0
  image: ">=4.8.0 <4.11.0"
  image_picker: ^1.2.3
  markdown: ^7.3.1
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  pdf: ^3.12.0
  pdfrx: ^2.2.24
  permission_handler: ^12.0.1
  timezone: ^0.11.1
  record: ^6.2.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.5
  speech_to_text: ^7.4.0
  url_launcher: ^6.3.2
  video_player: ^2.11.1
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/html/kit.css
    - assets/mermaid/diagram.html
    - assets/mermaid/mermaid.min.js
    - assets/mermaid/VERSION
    # Static weights of Space Grotesk for PDF export (the app font is variable).
    - assets/pdf/SpaceGrotesk-Regular.ttf
    - assets/pdf/SpaceGrotesk-Bold.ttf
    # Open Peeps line art (CC0), see assets/illustrations/CREDITS.md.
    # Listed one by one so previews/ and tools/ stay out of the bundle.
    - assets/illustrations/login.svg
    - assets/illustrations/hello.svg
    - assets/illustrations/github.svg
    - assets/illustrations/empty_knowledge.svg
    - assets/illustrations/empty_history.svg
    # Sign-in buttons: GitHub mark and Google "G" (bundled, they show before
    # sign-in when the backend icon proxy is not reachable yet).
    - assets/brand/sso/github_mark.svg
    - assets/brand/sso/google_g.svg

  fonts:
    - family: Doto
      fonts:
        - asset: assets/fonts/Doto.ttf
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
        - asset: assets/fonts/SpaceMono-Bold.ttf
          weight: 700

# Launcher icon: dot-matrix "s." mark. Source art + renderer in assets/brand/.
# Regenerate: python3 assets/brand/render_brand.py && dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/icon_legacy.png
  min_sdk_android: 21
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: assets/brand/icon_foreground.png
  adaptive_icon_monochrome: assets/brand/icon_monochrome.png
  # The layer PNGs are already drawn in the full 108dp frame with the mark
  # inside the 66dp safe zone, so no extra inset.
  adaptive_icon_foreground_inset: 0

# Splash: off-white / black to match AppColors light/dark backgrounds.
# Regenerate: dart run flutter_native_splash:create
flutter_native_splash:
  android: true
  ios: false
  web: false
  color: "#F4F4F2"
  color_dark: "#000000"
  image: assets/brand/splash_light.png
  image_dark: assets/brand/splash_dark.png
  android_12:
    color: "#F4F4F2"
    color_dark: "#000000"
    icon_background_color: "#F4F4F2"
    icon_background_color_dark: "#000000"
    image: assets/brand/splash12_light.png
    image_dark: assets/brand/splash12_dark.png
